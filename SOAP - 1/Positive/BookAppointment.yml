info:
  name: BookAppointment
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:5054/Service.svc
  headers:
    - name: Content-Type
      value: text/xml
    - name: X-Requested-With
      value: XMLHttpRequest
    - name: SOAPaction
      value: http://tempuri.org/IHospitalService/BookAppointment
  body:
    type: xml
    data: |-
      <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:tem="http://tempuri.org/" xmlns:mod="http://schemas.datacontract.org/2004/07/SOAP.Models">
         <soapenv:Header>
            <wsse:Security soapenv:mustUnderstand="1"
               xmlns:wsse="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-wssecurity-secext-1.0.xsd">
               <wsse:UsernameToken>
                  <wsse:Username>SoapUser1</wsse:Username>
                  <wsse:Password Type="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-username-token-profile-1.0#PasswordText">UserPassword1</wsse:Password>
               </wsse:UsernameToken>
            </wsse:Security>
         </soapenv:Header>
         <soapenv:Body>
            <tem:BookAppointment>
               <tem:appointment>
                  <mod:AppointmentDate>2026-07-04T14:00:00</mod:AppointmentDate>
                  <mod:DoctorId>1</mod:DoctorId>
                  <mod:Id>0</mod:Id>
                  <mod:Notes>New appointment</mod:Notes>
                  <mod:PatientId>1</mod:PatientId>
               </tem:appointment>
            </tem:BookAppointment>
         </soapenv:Body>
      </soapenv:Envelope>
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const xml = res.getBody();
        const match = xml.match(/<a:Id>(\d+)<\/a:Id>/);
        console.log("Script ran, match:", match);
        if (match) {
            bru.setVar("lastAppointmentId", match[1]);
            console.log("Saved appointmentId:", match[1]);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
