info:
  name: GetStudents (wrong origin)
  type: graphql
  seq: 8

graphql:
  method: POST
  url: http://localhost:5052/graphql
  headers:
    - name: Origin
      value: http://localhost:50
  body:
    query: |-
      query {
        students {
          id
          name
          grade
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
