info:
  name: CreateStudent
  type: graphql
  seq: 3

graphql:
  method: POST
  url: http://localhost:5052/graphql
  body:
    query: |-
      mutation {
        createStudent(name: "Oliver Poulsen", grade: 2) {
          id
          name
          grade
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
