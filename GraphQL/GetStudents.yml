info:
  name: GetStudents
  type: graphql
  seq: 1

graphql:
  method: POST
  url: http://localhost:5052/graphql
  body:
    query: |
      {
          students {
              name
              
          }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
